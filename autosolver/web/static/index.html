<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AutoSolver Agent · 骑手调度智能体</title>
<style>
  :root{
    --bg:#eef3f9; --bg2:#e7eef7;
    --panel:#ffffff; --panel-soft:#f6f9fc; --field:#f1f5fa;
    --ink:#1f2a3a; --ink2:#46566b; --dim:#8896a8; --faint:#aeb9c8;
    --line:#e3eaf3; --line2:#eef3f8;
    --primary:#1aa6b7; --primary2:#3b82f6; --violet:#8b7cf6;
    --green:#13b981; --amber:#f59e0b; --rose:#f25f7c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sh-sm:0 1px 2px rgba(31,42,58,.05),0 1px 3px rgba(31,42,58,.04);
    --sh:0 2px 6px rgba(31,42,58,.06),0 10px 30px rgba(31,42,58,.05);
    --sh-lg:0 8px 30px rgba(31,42,58,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-size:14px;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 8% -8%, #d9f3f0 0%, transparent 55%),
      radial-gradient(900px 600px at 100% 0%, #dde8fb 0%, transparent 55%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    background-attachment:fixed;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cdd8e6;border-radius:10px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#b7c5d8;background-clip:content-box}

  header{
    padding:16px 26px;display:flex;align-items:center;gap:14px;
    background:rgba(255,255,255,.7);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  }
  .logo{
    width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(135deg,var(--primary),var(--primary2) 70%,var(--violet));
    box-shadow:0 6px 16px rgba(26,166,183,.32);
  }
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
  header h1 .g{background:linear-gradient(90deg,var(--primary),var(--primary2),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  header .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  header .spacer{flex:1}
  header .tag{font-size:11.5px;color:var(--ink2);background:var(--panel-soft);border:1px solid var(--line);padding:5px 11px;border-radius:999px}

  .wrap{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px 22px;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;top:auto}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
  .side{padding:18px;position:sticky;top:84px}
  .sec-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .sec-t::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary)}
  label.f{display:block;color:var(--ink2);font-size:12px;margin:14px 0 6px;font-weight:500}
  select,textarea{
    width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:10px 11px;font-family:inherit;font-size:13px;transition:.15s;
  }
  select:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(26,166,183,.12)}
  textarea{height:88px;font-family:var(--mono);font-size:11px;resize:vertical;line-height:1.5;margin-top:8px}
  .upload{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1.5px dashed #c5d2e2;border-radius:11px;
    background:var(--panel-soft);cursor:pointer;font-size:12.5px;color:var(--ink2);transition:.15s}
  .upload:hover{border-color:var(--primary);background:#eef8f9;color:var(--ink)}
  .upload.has{border-style:solid;border-color:var(--primary);color:var(--primary);background:#ecf9fa}
  .upload .up-ic{font-size:15px;flex:none}
  .upload #fileName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;
    background:linear-gradient(90deg,var(--primary),var(--primary2));margin:8px 0 2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;border:2px solid var(--primary);box-shadow:var(--sh-sm);cursor:pointer}

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-top:9px;
    background:var(--panel-soft);border:1px solid var(--line);border-radius:11px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
  .toggle input{display:none}
  .sw{width:34px;height:20px;border-radius:999px;background:#d4dde9;position:relative;transition:.2s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:.2s}
  .toggle input:checked + .sw{background:linear-gradient(90deg,var(--primary),var(--primary2))}
  .toggle input:checked + .sw::after{transform:translateX(14px)}

  .btn{width:100%;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:650;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 6px 16px rgba(26,166,183,.30);transition:.18s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(26,166,183,.38)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:var(--sh-sm)}
  .btn.ghost{background:var(--panel-soft);color:var(--ink2);border:1px solid var(--line);box-shadow:none;font-weight:550;font-size:12.5px;padding:10px}
  .btn.ghost:hover{background:#eef3f8;transform:none;box-shadow:none;color:var(--ink)}
  .hint{margin-top:14px;color:var(--dim);font-size:12px;line-height:1.6;background:var(--panel-soft);border:1px solid var(--line2);border-radius:11px;padding:11px 12px}

  .main{display:flex;flex-direction:column;gap:18px;min-width:0}
  .topbar{padding:13px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:600;color:var(--primary);background:linear-gradient(135deg,rgba(26,166,183,.10),rgba(59,130,246,.10));
    border:1px solid rgba(26,166,183,.25);padding:6px 13px;border-radius:999px}
  .status{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(19,185,129,.18)}
  .dot.run{animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .timer{font-family:var(--mono);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

  .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
  @media(max-width:1100px){.cols{grid-template-columns:1fr}}
  .pane{padding:18px}
  .pane-h{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .pane-h .n{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2))}
  .pane-h .sub{font-weight:400;color:var(--faint);font-size:11.5px;margin-left:auto}

  /* trace timeline */
  .trace{display:flex;flex-direction:column;gap:0;position:relative}
  .tcard{position:relative;padding:0 0 14px 38px;animation:slidein .35s cubic-bezier(.2,.7,.3,1)}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .tcard::before{content:"";position:absolute;left:14px;top:26px;bottom:-4px;width:2px;background:var(--line)}
  .tcard:last-child::before{display:none}
  .tdot{position:absolute;left:2px;top:4px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;
    background:#fff;border:1.5px solid var(--line);box-shadow:var(--sh-sm);z-index:1}
  .tbody{background:var(--panel-soft);border:1px solid var(--line);border-radius:12px;padding:10px 13px;transition:.2s}
  .tbody:hover{box-shadow:var(--sh-sm);border-color:#d7e0ec}
  .tcard.improved .tdot{border-color:var(--green);box-shadow:0 0 0 3px rgba(19,185,129,.14)}
  .tcard.optimal .tdot{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,124,246,.16)}
  .tcard.pivot .tdot{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.14)}
  .t1{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .t1 .mv{font-weight:650;font-size:13px}
  .t1 .mv small{color:var(--faint);font-weight:500;margin-left:6px;font-size:11px}
  .t1 .sc{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
  .t2{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .badge{font-size:10.5px;font-weight:650;padding:3px 9px;border-radius:7px;display:inline-flex;gap:4px;align-items:center}
  .b-imp{background:rgba(19,185,129,.12);color:#0c8f64}
  .b-opt{background:rgba(139,124,246,.13);color:#6a55d8}
  .b-piv{background:rgba(245,158,11,.14);color:#b9770a}
  .b-base{background:rgba(59,130,246,.11);color:#2f6fd6}
  .t2 .meta{font-size:11px;color:var(--dim)}
  .vbar{flex:1;min-width:54px;height:5px;border-radius:5px;background:#e7eef6;overflow:hidden}
  .vbar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--violet));transition:width .5s}

  /* result */
  .hero{display:flex;align-items:flex-end;gap:14px;margin-bottom:4px}
  .hero .big{font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,var(--primary),var(--primary2) 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lbl{color:var(--dim);font-size:12px;margin-bottom:5px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
  .schip{background:var(--panel-soft);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--dim)}
  .schip b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;margin-left:2px}
  .asg{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;padding-right:4px}
  .grp{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-soft);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .grp .tk{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary2)}
  .grp .cs{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .grp .cs span{font-family:var(--mono);font-size:11px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px}

  .bars{display:flex;flex-direction:column;gap:10px}
  .bar{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;gap:10px}
  .bar .nm{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  .bar .nm i{font-style:normal}
  .bar .tk{height:10px;border-radius:6px;background:#e9eff6;overflow:hidden}
  .bar .tk>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--primary2),var(--violet));transition:width .6s cubic-bezier(.2,.7,.3,1)}
  .bar .vv{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}

  .mem .grp{flex-direction:column;align-items:stretch;gap:8px}
  .mem .pk{font-family:var(--mono);font-size:12px;color:#6a55d8;font-weight:600}
  .mem table{width:100%;border-collapse:collapse;font-size:11.5px}
  .mem th{color:var(--faint);font-weight:600;text-align:left;padding:3px 6px;border-bottom:1px solid var(--line2)}
  .mem td{padding:3px 6px;color:var(--ink2)}
  .mem td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .mem td.win{color:var(--green);font-weight:600}

  .muted{color:var(--dim);font-size:12.5px;line-height:1.6}
  .empty{color:var(--faint);text-align:center;padding:42px 12px;font-size:13px}
  .empty .ic{font-size:30px;display:block;margin-bottom:8px;opacity:.6}
</style>
</head>
<body>
<header>
  <div class="logo">🛵</div>
  <div>
    <h1><span class="g">AutoSolver</span> Agent</h1>
    <div class="sub">骑手调度优化 · 自主探索 / 自评估 / 自调整 / 跨实验学习</div>
  </div>
  <div class="spacer"></div>
  <div class="tag">6 策略 · 多臂老虎机 · 列生成</div>
</header>

<div class="wrap">
  <!-- controls -->
  <aside class="card side">
    <p class="sec-t">实例</p>
    <label class="f">内置用例</label>
    <select id="caseSel"></select>
    <label class="f">或上传 / 粘贴用例（优先级高于上面的下拉）</label>
    <label class="upload" for="caseFile">
      <span class="up-ic">📂</span>
      <span id="fileName">点击上传 .txt 用例文件</span>
      <input type="file" id="caseFile" accept=".txt,.tsv,.csv" hidden/>
    </label>
    <textarea id="caseText" placeholder="或在此粘贴：task_id_list ⇥ station_id ⇥ score ⇥ willingness"></textarea>

    <p class="sec-t" style="margin-top:20px">设置</p>
    <label class="f">时间预算：<b id="budVal" style="color:var(--primary)">10</b> 秒</label>
    <input id="budget" type="range" min="2" max="45" value="10" step="1"/>
    <label class="toggle"><span>CP-SAT 精确引擎</span><input type="checkbox" id="cpsat"/><span class="sw"></span></label>
    <label class="toggle"><span>LLM 策略（LongCat，需 ≥20s）</span><input type="checkbox" id="llm"/><span class="sw"></span></label>

    <div style="margin-top:18px;display:flex;flex-direction:column;gap:9px">
      <button class="btn" id="run">▶ 运行 Agent</button>
      <button class="btn ghost" id="resetMem">清空学习记忆</button>
    </div>
    <p class="hint" id="hint">选用例 → 点运行，右侧会<b>实时</b>显示 agent 的决策：尝试哪个策略、改进多少、是否转向。多次运行同类实例，可在底部看它<b>从历史中学习</b>。</p>
  </aside>

  <!-- main -->
  <div class="main">
    <div class="card topbar">
      <span class="chip" id="profile">— 选择用例后开始 —</span>
      <span class="status" id="status"><span class="dot"></span>就绪</span>
      <span class="spacer" style="flex:1"></span>
      <span class="timer" id="timer"></span>
    </div>

    <div class="cols">
      <section class="card pane">
        <p class="pane-h"><span class="n">1</span> Agent 决策轨迹<span class="sub">实时流</span></p>
        <div class="trace" id="trace"><div class="empty"><span class="ic">🧭</span>尚未运行</div></div>
      </section>

      <section style="display:flex;flex-direction:column;gap:18px;min-width:0">
        <div class="card pane">
          <p class="pane-h"><span class="n">2</span> 最终方案</p>
          <div id="result"><div class="empty"><span class="ic">🎯</span>等待结果</div></div>
        </div>
        <div class="card pane">
          <p class="pane-h"><span class="n">3</span> 策略价值<span class="sub">agent 的信任度</span></p>
          <div class="bars" id="bars"><div class="muted">运行后显示</div></div>
        </div>
        <div class="card pane">
          <p class="pane-h"><span class="n">4</span> 跨实验学习记忆</p>
          <div id="mem"><div class="muted">暂无</div></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const trace=$('#trace'), result=$('#result'), bars=$('#bars');
let moveValues={}, t0=0, timerInt=null;

const STRAT={
  greedy:{ic:'⚡',zh:'贪心'}, heuristic:{ic:'🧭',zh:'启发式'},
  exact:{ic:'🎯',zh:'精确MILP'}, milp:{ic:'🎯',zh:'精确MILP'}, cpsat:{ic:'🎯',zh:'CP-SAT'},
  colgen:{ic:'🧬',zh:'列生成'}, lp:{ic:'📐',zh:'LP松弛'},
  perturb:{ic:'🌀',zh:'扰动重组'}, llm:{ic:'🤖',zh:'LLM推理'},
};
const meta = m => STRAT[m]||{ic:'•',zh:m};
function metaOf(m){
  if(STRAT[m]) return STRAT[m];
  if((m||'').startsWith('colgen_')) return {ic:'🧩',zh:'列生成'};
  if((m||'').startsWith('perturb_')) return {ic:'🌀',zh:'局部搜索'};
  return {ic:'•',zh:m};
}

async function loadCases(){
  const j=await (await fetch('/api/cases')).json();
  const sel=$('#caseSel'); sel.innerHTML='';
  (j.cases||[]).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
}
async function loadMem(){
  const j=await (await fetch('/api/memory')).json();
  const m=j.memory||{}, el=$('#mem'), keys=Object.keys(m);
  if(!keys.length){el.innerHTML='<div class="muted">暂无 —— 运行几次后，这里会积累「什么画像的实例上、哪个策略好用」。</div>';return;}
  el.innerHTML=keys.map(k=>{
    const mv=m[k];
    const best=Object.keys(mv).sort((a,b)=>(mv[b].improve_rate||0)-(mv[a].improve_rate||0))[0];
    const rows=Object.keys(mv).map(x=>{const s=mv[x], mt=metaOf(x);return `<tr><td class="${x===best&&s.improve_rate>0?'win':''}">${mt.ic} ${mt.zh}</td><td class="n">${s.tries}</td><td class="n">${s.wins}</td><td class="n">${(s.improve_rate||0).toFixed(3)}</td></tr>`;}).join('');
    return `<div class="grp mem"><div class="pk">${k}</div><table><tr><th>策略</th><th style="text-align:right">尝试</th><th style="text-align:right">获胜</th><th style="text-align:right">平均改进</th></tr>${rows}</table></div>`;
  }).join('');
}

function clearEmpty(el){const e=el.querySelector('.empty');if(e)el.innerHTML='';}

function addBaseline(text){
  clearEmpty(trace);
  const m=text.match(/(\w+)\s+->\s+([\d.]+)/), name=m?m[1]:'greedy';
  const mt=metaOf(name);
  const c=document.createElement('div'); c.className='tcard';
  c.innerHTML=`<div class="tdot">${mt.ic}</div><div class="tbody">
    <div class="t1"><span class="mv">${mt.zh}<small>${name}</small></span><span class="sc">${m?(+m[2]).toFixed(2):''}</span></div>
    <div class="t2"><span class="badge b-base">基线</span></div></div>`;
  trace.appendChild(c);
}
function addCard(ev){
  clearEmpty(trace);
  const cls=[ev.improved?'improved':'',ev.optimal?'optimal':'',ev.pivot?'pivot':''].join(' ');
  let b='';
  if(ev.improved) b+=`<span class="badge b-imp">▲ 改进 +${(ev.gain||0).toFixed(3)}</span>`;
  if(ev.optimal) b+=`<span class="badge b-opt">✦ 已证明全局最优</span>`;
  else if(ev.restricted_optimal) b+=`<span class="badge b-opt">✦ 已证明当前列池最优</span>`;
  if(ev.pivot) b+=`<span class="badge b-piv">↻ 停滞·转向</span>`;
  const sc=ev.score==null?`<span style="color:var(--rose)">infeasible</span>`:(+ev.score).toFixed(2);
  const vw=Math.max(0,Math.min(100,(ev.value||0)*100/0.4));
  const mt=metaOf(ev.move);
  const c=document.createElement('div'); c.className='tcard '+cls;
  c.innerHTML=`<div class="tdot">${mt.ic}</div><div class="tbody">
    <div class="t1"><span class="mv">${mt.zh}<small>${ev.move}</small></span><span class="sc">${sc}</span></div>
    <div class="t2">${b}<span class="meta">预算 ${ev.budget}s</span><span class="vbar"><i style="width:${vw}%"></i></span></div></div>`;
  trace.appendChild(c);
  trace.scrollTop=trace.scrollHeight;
  moveValues[ev.move]=ev.value;
}

function countUp(el,to){
  const dur=650, st=performance.now();
  function f(now){const p=Math.min(1,(now-st)/dur);el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(2);if(p<1)requestAnimationFrame(f);}
  requestAnimationFrame(f);
  setTimeout(()=>{el.textContent=(+to).toFixed(2);},dur+90);   // guarantee final value (rAF may be throttled)
}
function renderResult(ev){
  const grp=(ev.groups||[]).map(g=>`<div class="grp"><span class="tk">${g[0]}</span><span class="cs">${g[1].map(c=>`<span>${c}</span>`).join('')}</span></div>`).join('');
  result.innerHTML=`<div class="hero"><div class="big" id="bigsc">0.00</div><div class="lbl">总成本（越低越好）</div></div>
    <div class="chips">
      <div class="schip">覆盖<b>${ev.assigned}/${ev.total_tasks}</b></div>
      <div class="schip">胜出<b>${metaOf(ev.winner).zh}</b></div>
      <div class="schip">用时<b>${ev.seconds}s</b></div>
      <div class="schip">探索<b>${ev.steps}</b>步</div>
    </div>
    <div class="asg">${grp||'<div class="muted">—</div>'}</div>`;
  countUp($('#bigsc'),ev.best);
  const names=Object.keys(moveValues);
  if(names.length){
    const mx=Math.max(0.001,...names.map(n=>moveValues[n]));
    bars.innerHTML=names.map(n=>{const w=Math.max(3,moveValues[n]*100/mx);
      const mt=metaOf(n);
      return `<div class="bar"><span class="nm"><i>${mt.ic}</i>${mt.zh}</span><span class="tk"><i style="width:0%" data-w="${w}"></i></span><span class="vv">${moveValues[n].toFixed(3)}</span></div>`;}).join('');
    requestAnimationFrame(()=>bars.querySelectorAll('.tk>i').forEach(i=>i.style.width=i.dataset.w+'%'));
  }
}

async function run(){
  trace.innerHTML='<div class="empty"><span class="ic">⏳</span>求解中…</div>';
  result.innerHTML='<div class="empty"><span class="ic">⏳</span>求解中…</div>'; bars.innerHTML=''; moveValues={};
  $('#run').disabled=true; $('#status').innerHTML='<span class="dot run"></span>运行中'; $('#profile').textContent='— 分析实例中 —';
  t0=Date.now(); clearInterval(timerInt);
  timerInt=setInterval(()=>$('#timer').textContent=((Date.now()-t0)/1000).toFixed(1)+'s',100);
  const body={case_name:$('#caseSel').value,case_text:$('#caseText').value,budget:+$('#budget').value,cpsat:$('#cpsat').checked,llm:$('#llm').checked};
  let resp;
  try{resp=await fetch('/api/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
  catch(e){$('#status').innerHTML='<span class="dot" style="background:var(--rose)"></span>连接失败';$('#run').disabled=false;clearInterval(timerInt);return;}
  const reader=resp.body.getReader(), dec=new TextDecoder(); let buf='';
  while(true){
    const {value,done}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf('\n\n'))>=0){const ch=buf.slice(0,i);buf=buf.slice(i+2);
      if(!ch.startsWith('data:'))continue;
      let ev; try{ev=JSON.parse(ch.slice(5).trim());}catch(e){continue;} handle(ev);}
  }
  $('#run').disabled=false; $('#status').innerHTML='<span class="dot"></span>完成'; clearInterval(timerInt); loadMem();
}
function handle(ev){
  if(ev.event==='profile') $('#profile').textContent=`${ev.profile_key} · ${ev.task_count}任务 ${ev.courier_count}快递员 ${ev.candidates}候选`;
  else if(ev.event==='move') addCard(ev);
  else if(ev.event==='done') renderResult(ev);
  else if(ev.kind==='try' && ev.text && ev.text.includes('baseline')) addBaseline(ev.text);
  else if(ev.kind==='stop') $('#status').innerHTML='<span class="dot" style="background:var(--violet)"></span>提前停止·已证明全局最优';
  else if(ev.kind==='error') result.innerHTML=`<div class="empty" style="color:var(--rose)"><span class="ic">⚠️</span>${ev.text}</div>`;
}

$('#caseFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ $('#caseText').value=rd.result;
    const up=document.querySelector('.upload'); up.classList.add('has');
    $('#fileName').textContent='已载入：'+f.name+'（'+(rd.result.split(/\r?\n/).length)+' 行）'; };
  rd.readAsText(f);
};
$('#caseText').addEventListener('input',()=>{
  if(!$('#caseText').value.trim()){ const up=document.querySelector('.upload'); up.classList.remove('has'); $('#fileName').textContent='点击上传 .txt 用例文件'; $('#caseFile').value=''; }
});
$('#budget').oninput=e=>$('#budVal').textContent=e.target.value;
$('#run').onclick=run;
$('#resetMem').onclick=async()=>{await fetch('/api/reset_memory',{method:'POST'});loadMem();$('#status').innerHTML='<span class="dot"></span>记忆已清空';};
loadCases(); loadMem();
</script>
</body>
</html>
