# Render blueprint — push this repo to GitHub, then on render.com:
#   New +  ->  Blueprint  ->  pick this repo. It reads this file and deploys.
# You get a public URL like https://autosolver-agent.onrender.com
services:
  - type: web
    name: autosolver-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m autosolver.web.server
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
